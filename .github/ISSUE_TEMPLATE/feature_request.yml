name: Feature Request
description: Suggest an idea or enhancement for unity-openxr-starter.
title: "feat: [Short description]"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please outline your proposal and the problem it solves.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific XR problem or limitation?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Architectural Design
      description: Describe the solution you'd like to see added to the foundation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative implementations or existing third-party packages considered.
