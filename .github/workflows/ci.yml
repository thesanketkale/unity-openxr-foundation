name: CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-validate:
    name: Meta & Repository Verification
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run fast repository verification
        shell: bash
        run: |
          bash scripts/verify.sh fast

  tests-and-quality:
    name: Standalone Tests & Math Suite
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Run Standalone Test Suite
        shell: bash
        run: |
          dotnet test tests/Foundation.StandaloneTests/Foundation.StandaloneTests.csproj --configuration Release --verbosity normal

  security-scan:
    name: Security & Secret Audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Clean-Room & Credentials Guard
        shell: bash
        run: |
          bash tools/guard.sh

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  unity-xr-build:
    name: Standalone Quest / Android Build
    runs-on: ubuntu-24.04
    needs: [lint-and-validate, tests-and-quality, security-scan]
    permissions:
      contents: read
    timeout-minutes: 45
    if: vars.UNITY_CI == 'true'
    steps:
      - name: Notice on Unity CI Execution
        shell: bash
        run: |
          echo "UNITY_CI is enabled. Executing Unity standalone build pipeline."
          echo "Self-hosted Unity runner or GameCI credentials are required for batchmode compilation."
