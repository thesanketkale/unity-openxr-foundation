name: Release

'on':
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  build-and-release:
    name: Package and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Package Release Assets
        shell: bash
        run: |
          mkdir -p dist
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          ARCHIVE_NAME="unity-openxr-starter-${TAG_NAME}.zip"
          git archive --format=zip --output="dist/${ARCHIVE_NAME}" HEAD Assets/ Packages/ ProjectSettings/ xr-requirements.json README.md LICENSE
          cd dist
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
