name: Release

'on':
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  build-and-release:
    name: Package and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Package Release Assets
        shell: bash
        run: |
          mkdir -p dist
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          ARCHIVE_NAME="unity-openxr-starter-${TAG_NAME}.zip"
          git archive --format=zip --output="dist/${ARCHIVE_NAME}" HEAD Assets/ Packages/ ProjectSettings/ xr-requirements.json README.md LICENSE
          cd dist
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
